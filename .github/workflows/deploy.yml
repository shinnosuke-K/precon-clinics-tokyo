name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 権限はジョブ単位で最小限に付与する
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build and deploy
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read # リポジトリを checkout するために必要
      actions: read # deploy-pages がアップロード済みアーティファクトを Actions API で探すのに必要
      pages: write # deploy-pages が GitHub Pages にデプロイするために必要
      id-token: write # deploy-pages が OIDC トークンでデプロイ元を検証するために必要
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 後続ステップで git push しないので認証情報は残さない
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # 依存は build.py のインラインメタデータ（openpyxl 1つ）だけなのでキャッシュ不要
          enable-cache: false

      - name: Regenerate src/data/clinics.json from data/
        run: uv run scripts/build.py

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5.0.1
