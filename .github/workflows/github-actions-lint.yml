name: GitHub Actions Lint

# 権限は各ジョブで最小限に付与する
permissions: {}

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read # ワークフローファイルを checkout するために必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: koki-develop/github-actions-lint/actionlint@5ecd42b59803f14bfaa7ed0bfb8de8c1dc1b4c6d # v1.6.0

  ghalint:
    name: ghalint
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read # ワークフローファイルを checkout するために必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: koki-develop/github-actions-lint/ghalint@5ecd42b59803f14bfaa7ed0bfb8de8c1dc1b4c6d # v1.6.0

  zizmor:
    name: zizmor
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read # ワークフローファイルを checkout するために必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: koki-develop/github-actions-lint/zizmor@5ecd42b59803f14bfaa7ed0bfb8de8c1dc1b4c6d # v1.6.0
        with:
          # オンラインモードで GitHub API を使う監査も有効にする
          github-token: ${{ github.token }}
          persona: auditor
