name: GitHub Actions Lint

# 権限は各ジョブで最小限に付与する
permissions: {}

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read # ワークフローファイルを checkout するために必要
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        working-directory: ${{ runner.temp }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 755 actionlint /usr/local/bin/actionlint
      - run: actionlint -color -verbose

  ghalint:
    name: ghalint
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read # ワークフローファイルを checkout するために必要
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install ghalint
        working-directory: ${{ runner.temp }}
        env:
          GHALINT_VERSION: 1.6.0
          GHALINT_SHA256: eda1af79c1a4a31c2de5831cd1333ad582fa6fa72015f8e9c1c4525d550c1d35
        run: |
          curl -fsSL -o ghalint.tar.gz "https://github.com/suzuki-shunsuke/ghalint/releases/download/v${GHALINT_VERSION}/ghalint_${GHALINT_VERSION}_linux_amd64.tar.gz"
          echo "${GHALINT_SHA256}  ghalint.tar.gz" | sha256sum -c -
          tar -xzf ghalint.tar.gz ghalint
          sudo install -m 755 ghalint /usr/local/bin/ghalint
      - run: ghalint run
        env:
          GHALINT_LOG_COLOR: always

  zizmor:
    name: zizmor
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read # ワークフローファイルを checkout するために必要
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          # lockfile（actions.lock）を認識できる 1.32.0 以降を使う
          version: 1.32.0
          persona: auditor
          # Advanced Security（SARIF アップロード）は使わず、指摘があればジョブを失敗させる
          advanced-security: false
          annotations: true

  actions-lock:
    name: gh actions-lock --verify
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read # ワークフローファイルと actions.lock を checkout するために必要
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTIONS_LOCK_VERSION: v0.4.1
        run: gh extension install github/gh-actions-lock --pin "${GH_ACTIONS_LOCK_VERSION}"
      # actions.lock がワークフローの uses: と一致し、各 pin が上流で検証できることを確認する
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
